name: Deploy Salon API

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.GITHUBACTIONSSALONDEPLOYROLE }}
          aws-region: ap-south-1

      - name: Deploy to EC2
        shell: bash
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-01f2a43f4b07400b2" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/backend-salon",
              "git pull origin main",
              "docker build -t api:latest .",
              "docker rm -f salon-api || true",
              "docker run -d --name salon-api --network salon --env-file .env -p 4000:4000 --restart unless-stopped api:latest",
              "sleep 10",
              "curl -f http://localhost:4000/health"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          sleep 15

          aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "i-01f2a43f4b07400b2" \
          --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
          --output yaml